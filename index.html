<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>واصل AI</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
        }

        #chat-box {
            scroll-behavior: smooth;
        }

        .message {
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body class="bg-slate-950 text-white min-h-screen flex flex-col">

    <header class="border-b border-slate-800 bg-slate-950/90 backdrop-blur">
        <div class="max-w-4xl mx-auto p-4 flex justify-between items-center">

            <div class="flex items-center gap-3">

                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-xl shadow-lg">
                    و
                </div>

                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                        واصل AI
                    </h1>

                    <p class="text-xs text-slate-500">
                        Wasel AI
                    </p>
                </div>

            </div>

            <div class="text-xs px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-2">

                <span class="w-2 h-2 bg-emerald-400 rounded-full"></span>

                Gemini نشط
            </div>

        </div>
    </header>


    <main
        id="chat-box"
        class="flex-1 w-full max-w-4xl mx-auto p-4 overflow-y-auto space-y-5"
    >

        <div class="flex gap-3 items-start">

            <div class="w-9 h-9 rounded-full bg-indigo-600/20 text-indigo-400 flex items-center justify-center shrink-0">
                <i class="fa-solid fa-robot"></i>
            </div>

            <div class="bg-slate-800 border border-slate-700/50 p-4 rounded-2xl max-w-[85%] text-slate-200 message">

                مرحباً بك في واصل AI! 👋

                أنا مساعدك الذكي. اكتب سؤالك وسأحاول مساعدتك.

            </div>

        </div>

    </main>


    <footer class="border-t border-slate-800 bg-slate-950 p-4">

        <div class="max-w-4xl mx-auto">

            <form
                id="chat-form"
                class="flex gap-2 bg-slate-800 p-2 rounded-2xl border border-slate-700 focus-within:border-indigo-500 transition"
            >

                <input
                    type="text"
                    id="user-input"
                    placeholder="اكتب رسالتك هنا..."
                    autocomplete="off"
                    required
                    class="flex-1 bg-transparent px-3 outline-none text-slate-100 placeholder-slate-500"
                >

                <button
                    id="send-button"
                    type="submit"
                    class="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 px-5 py-3 rounded-xl text-white font-medium transition flex items-center gap-2"
                >

                    <span>إرسال</span>

                    <i class="fa-solid fa-paper-plane text-xs"></i>

                </button>

            </form>

            <p class="text-center text-xs text-slate-600 mt-3">
                واصل AI قد يخطئ، تحقق من المعلومات المهمة.
            </p>

        </div>

    </footer>


    <script>

        const chatForm = document.getElementById("chat-form");
        const userInput = document.getElementById("user-input");
        const chatBox = document.getElementById("chat-box");
        const sendButton = document.getElementById("send-button");


        function escapeHTML(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
        }


        function addUserMessage(text) {

            chatBox.innerHTML += `

                <div class="flex gap-3 items-start justify-end">

                    <div class="bg-indigo-600 text-white p-4 rounded-2xl max-w-[85%] message">

                        ${escapeHTML(text)}

                    </div>

                </div>

            `;

            scrollChat();
        }


        function addAIMessage(text) {

            chatBox.innerHTML += `

                <div class="flex gap-3 items-start">

                    <div class="w-9 h-9 rounded-full bg-indigo-600/20 text-indigo-400 flex items-center justify-center shrink-0">

                        <i class="fa-solid fa-robot text-sm"></i>

                    </div>

                    <div class="bg-slate-800 border border-slate-700/50 p-4 rounded-2xl max-w-[85%] text-slate-200 message">

                        ${escapeHTML(text)}

                    </div>

                </div>

            `;

            scrollChat();
        }


        function addErrorMessage(text) {

            chatBox.innerHTML += `

                <div class="flex gap-3 items-start">

                    <div class="w-9 h-9 rounded-full bg-red-600/20 text-red-400 flex items-center justify-center shrink-0">

                        <i class="fa-solid fa-triangle-exclamation"></i>

                    </div>

                    <div class="bg-slate-800 border border-red-500/30 p-4 rounded-2xl max-w-[85%] text-red-300 message">

                        ${escapeHTML(text)}

                    </div>

                </div>

            `;

            scrollChat();
        }


        function scrollChat() {

            chatBox.scrollTop = chatBox.scrollHeight;

        }


        chatForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            const text = userInput.value.trim();

            if (!text) return;


            addUserMessage(text);

            userInput.value = "";

            userInput.disabled = true;

            sendButton.disabled = true;


            const loading = document.createElement("div");

            loading.className = "flex gap-3 items-start";

            loading.innerHTML = `

                <div class="w-9 h-9 rounded-full bg-indigo-600/20 text-indigo-400 flex items-center justify-center shrink-0">

                    <i class="fa-solid fa-robot text-sm"></i>

                </div>

                <div class="bg-slate-800 border border-slate-700/50 p-4 rounded-2xl text-slate-400">

                    <i class="fa-solid fa-circle-notch fa-spin"></i>

                    جاري التفكير...

                </div>

            `;

            chatBox.appendChild(loading);

            scrollChat();


            try {

                const response = await fetch("/api/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        text: text
                    })

                });


                /*
                 * لا نفترض أن Vercel سيرجع JSON دائمًا.
                 * نقرأ الرد كنص أولًا حتى نعرف الخطأ الحقيقي.
                 */

                const rawText = await response.text();

                loading.remove();


                let data = null;

                try {

                    data = JSON.parse(rawText);

                } catch (jsonError) {

                    throw new Error(
                        "الخادم أعاد ردًا غير صالح:\n\n" +
                        rawText.substring(0, 1000)
                    );

                }


                if (!response.ok) {

                    throw new Error(
                        data.error || "حدث خطأ من الخادم."
                    );

                }


                if (!data.reply) {

                    throw new Error(
                        "لم يصل رد من Gemini."
                    );

                }


                addAIMessage(data.reply);


            } catch (error) {

                loading.remove();

                addErrorMessage(
                    error.message || "حدث خطأ أثناء الاتصال بالخادم."
                );

            }


            userInput.disabled = false;

            sendButton.disabled = false;

            userInput.focus();

        });

    </script>

</body>

</html>
