<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>واصل AI - Wasel AI</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .app {
      max-width: 900px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2563eb;
      color: white;
      font-weight: bold;
      font-size: 20px;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
    }

    .brand span {
      font-size: 12px;
      color: #6b7280;
    }

    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .welcome {
      text-align: center;
      padding: 70px 20px;
      color: #6b7280;
    }

    .welcome h2 {
      color: #172033;
      margin-bottom: 10px;
    }

    .message {
      display: flex;
      margin-bottom: 18px;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: white;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 5px;
    }

    .file-preview {
      margin-bottom: 8px;
      padding: 9px 12px;
      border-radius: 12px;
      background: #eef2ff;
      color: #374151;
      font-size: 13px;
    }

    .generated-image {
      display: block;
      max-width: 100%;
      border-radius: 15px;
      margin-top: 8px;
    }

    .input-area {
      background: white;
      border-top: 1px solid #e5e7eb;
      padding: 12px;
      position: sticky;
      bottom: 0;
    }

    .selected-file {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .selected-file button {
      border: 0;
      background: transparent;
      color: #dc2626;
      cursor: pointer;
      font-size: 18px;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 150px;
      border: 1px solid #d1d5db;
      border-radius: 15px;
      padding: 13px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    .btn {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .attach-btn {
      background: #eef2ff;
      color: #2563eb;
    }

    .send-btn {
      background: #2563eb;
      color: white;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #fileInput {
      display: none;
    }

    .status {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      padding: 5px;
      display: none;
    }

    @media (max-width: 600px) {
      #chat {
        padding: 12px;
      }

      .bubble {
        max-width: 92%;
      }

      header {
        padding: 12px 15px;
      }

      .welcome {
        padding: 50px 15px;
      }
    }
  </style></head><body><div class="app">  <header>
    <div class="brand">
      <div class="logo">و</div>  <div>
    <h1>واصل AI</h1>
    <span>مساعدك الذكي متعدد الوسائط</span>
  </div>
</div>

  </header>  <main id="chat"><div class="welcome" id="welcome">
  <h2>مرحبًا بك في واصل AI 👋</h2>

  <p>
    اسألني أي شيء، أو أرسل صورة، فيديو، ملف صوتي أو PDF لتحليله.
  </p>

  <p>
    ويمكنك أيضًا طلب إنشاء صورة بالذكاء الاصطناعي.
  </p>
</div>

  </main>  <div class="input-area"><div class="selected-file" id="selectedFile">

  <span id="fileName"></span>

  <button onclick="removeFile()" title="إزالة الملف">
    ×
  </button>

</div>


<div class="status" id="status">
  جاري التفكير...
</div>


<div class="input-row">

  <button
    class="btn attach-btn"
    onclick="document.getElementById('fileInput').click()"
    title="إرفاق ملف">
    📎
  </button>


  <input
    type="file"
    id="fileInput"
    accept="
      image/*,
      video/*,
      audio/*,
      application/pdf
    "
    onchange="handleFile(event)"
  >


  <textarea
    id="messageInput"
    placeholder="اكتب رسالتك هنا..."
    rows="1"
    onkeydown="handleKey(event)"
  ></textarea>


  <button
    class="btn send-btn"
    id="sendBtn"
    onclick="sendMessage()"
    title="إرسال">
    ➤
  </button>

</div>

  </div></div><script>

  let selectedFile = null;


  function handleFile(event) {

    const file = event.target.files[0];

    if (!file) {
      return;
    }


    const maxSize = 3.5 * 1024 * 1024;

    if (file.size > maxSize) {

      alert(
        "حجم الملف كبير جدًا.\n\n" +
        "الحد الحالي هو 3.5 MB."
      );

      event.target.value = "";
      return;
    }


    const allowed = [
      "image/",
      "video/",
      "audio/",
      "application/pdf"
    ];


    const supported = allowed.some(type =>
      file.type.startsWith(type) ||
      file.type === type
    );


    if (!supported) {

      alert("نوع الملف غير مدعوم.");

      event.target.value = "";
      return;
    }


    selectedFile = file;


    document.getElementById("fileName").textContent =
      "📎 " + file.name;


    document.getElementById("selectedFile").style.display =
      "flex";
  }



  function removeFile() {

    selectedFile = null;

    document.getElementById("fileInput").value = "";

    document.getElementById("selectedFile").style.display =
      "none";
  }



  function handleKey(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();
    }
  }



  function addMessage(type, content) {

    const chat = document.getElementById("chat");

    const welcome = document.getElementById("welcome");

    if (welcome) {
      welcome.remove();
    }


    const message = document.createElement("div");

    message.className =
      "message " + type;


    const bubble = document.createElement("div");

    bubble.className = "bubble";


    if (typeof content === "string") {

      bubble.textContent = content;

    } else {

      bubble.appendChild(content);
    }


    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return bubble;
  }



  function addImageMessage(imageData, text) {

    const wrapper = document.createElement("div");


    if (text) {

      const textElement =
        document.createElement("div");

      textElement.textContent = text;

      textElement.style.marginBottom = "10px";

      wrapper.appendChild(textElement);
    }


    const image =
      document.createElement("img");

    image.src = imageData;

    image.className =
      "generated-image";

    image.alt =
      "الصورة التي أنشأها واصل AI";


    wrapper.appendChild(image);


    addMessage("ai", wrapper);
  }



  function fileToBase64(file) {

    return new Promise((resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload = () => {

        resolve(reader.result);
      };


      reader.onerror = () => {

        reject(
          new Error("تعذر قراءة الملف.")
        );
      };


      reader.readAsDataURL(file);

    });
  }



  async function sendMessage() {

    const input =
      document.getElementById("messageInput");

    const sendBtn =
      document.getElementById("sendBtn");

    const status =
      document.getElementById("status");


    const text =
      input.value.trim();


    if (!text && !selectedFile) {

      return;
    }


    let fileForRequest = selectedFile;


    input.value = "";

    sendBtn.disabled = true;

    status.style.display = "block";


    let userContent = "";


    if (fileForRequest) {

      userContent +=
        "📎 " + fileForRequest.name + "\n\n";
    }


    if (text) {

      userContent += text;
    }


    addMessage(
      "user",
      userContent
    );


    try {

      let fileData = null;


      if (fileForRequest) {

        fileData =
          await fileToBase64(fileForRequest);
      }


      const response =
        await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            text,

            fileData,

            fileName:
              fileForRequest
                ? fileForRequest.name
                : "",

            mimeType:
              fileForRequest
                ? fileForRequest.type
                : ""
          })

        });


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "حدث خطأ في الخادم."
        );
      }


      if (data.type === "image") {

        addImageMessage(
          data.image,
          data.reply
        );

      } else {

        addMessage(
          "ai",
          data.reply ||
          "لم يصل رد من الذكاء الاصطناعي."
        );
      }


    } catch (error) {

      console.error(error);


      addMessage(
        "ai",
        "❌ " +
        (
          error.message ||
          "حدث خطأ غير متوقع."
        )
      );

    } finally {

      removeFile();

      sendBtn.disabled = false;

      status.style.display = "none";

      input.focus();
    }

  }

</script></body>
    </html>
