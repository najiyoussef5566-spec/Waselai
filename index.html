    <!-- Interactive Script with Groq API -->
    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');

        // استخدم مفتاح Groq الخاص بك هنا
        const API_KEY = "gsk_ضع_مفتاح_جروك_هنا";

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // عرض رسالة المستخدم
            chatBox.innerHTML += `
                <div class="flex gap-3 items-start justify-end">
                    <div class="bg-indigo-600 text-white p-4 rounded-2xl max-w-[85%]">
                        ${text}
                    </div>
                </div>
            `;

            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // عرض مؤشر جاري التفكير
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div id="${loadingId}" class="flex gap-3 items-start">
                    <div class="w-8 h-8 rounded-full bg-indigo-600/20 text-indigo-400 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-robot text-sm"></i>
                    </div>
                    <div class="bg-slate-800 border border-slate-700/50 p-4 rounded-2xl max-w-[85%] text-slate-400 italic">
                        جاري التفكير...
                    </div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: "أنت مساعد ذكي اسمه واصل AI، تجيب باللغة العربية بدقة ووضوح." },
                            { role: "user", content: text }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiReply = data.choices[0].message.content;

                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `
                    <div class="flex gap-3 items-start">
                        <div class="w-8 h-8 rounded-full bg-indigo-600/20 text-indigo-400 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-robot text-sm"></i>
                        </div>
                        <div class="bg-slate-800 border border-slate-700/50 p-4 rounded-2xl max-w-[85%] text-slate-200 whitespace-pre-wrap">
                            ${aiReply}
                        </div>
                    </div>
                `;
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `
                    <div class="flex gap-3 items-start">
                        <div class="w-8 h-8 rounded-full bg-red-600/20 text-red-400 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-triangle-exclamation text-sm"></i>
                        </div>
                        <div class="bg-slate-800 border border-red-500/30 p-4 rounded-2xl max-w-[85%] text-red-300">
                            خطأ: ${error.message || "فشل الاتصال بالخدمة"}
                        </div>
                    </div>
                `;
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
