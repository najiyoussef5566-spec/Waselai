<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واصل AI - Wasel AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 p-4 flex justify-between items-center max-w-4xl w-full mx-auto">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-xl">و</div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">واصل AI</h1>
        </div>
        <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">الذكاء الاصطناعي نشط</span>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col gap-4 overflow-y-auto" id="chat-box">
        <div class="flex gap-3 items-start">
            <div class="w-8 h-8 rounded-full bg-indigo-600/20 text-indigo-400 flex items-center justify-center shrink-0">
                <i class="fa-solid fa-robot text-sm"></i>
            </div>
            <div class="bg-slate-800 border border-slate-700/50 p-4 rounded-2xl max-w-[85%] text-slate-200">
                مرحباً بك في **واصل AI**! أهلاً بك، تفضل بطرح أسئلتك وسأجيبك فوراً وبدقة.
            </div>
        </div>
    </main>

    <!-- Input Box -->
    <footer class="p-4 max-w-4xl w-full mx-auto">
        <form id="chat-form" class="flex gap-2 bg-slate-800/80 p-2 rounded-xl border border-slate-700 focus-within:border-indigo-500 transition">
            <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." required class="flex-1 bg-transparent px-3 outline-none text-slate-100 placeholder-slate-400">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-white font-medium transition flex items-center gap-2">
                <span>إرسال</span>
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </form>
    </footer>

    <!-- Script -->
    <script>
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // 1. عرض رسالة المستخدم
            chatBox.innerHTML += `
                <div class="flex gap-3 items-start justify-end">
                    <div class="bg-indigo-600 text-white p-4 rounded-2xl max-w-[85%]">
                        ${text}
                    </div>
                </div>
            `;

            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. مؤشر التفكير
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div id="${loadingId}" class="flex gap-3 items-start">
                    <div class="w-8 h-8 rounded-full bg-indigo-600/20 text-indigo-400 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-robot text-sm"></i>
                    </div>
                    <div class="bg-slate-800 border border-slate-700/50 p-4 rounded-2xl max-w-[85%] text-slate-400 italic">
                        جاري التفكير...
                    </div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. الاتصال عبر رابط الخدمة المستقر والآمن
            try {
                const encodedText = encodeURIComponent(text);
                const response = await fetch(`https://text.pollinations.ai/${encodedText}?model=openai`);
                
                if (!response.ok) throw new Error("تعذر الاتصال بالخادم.");

                const aiReply = await response.text();
                
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();

                chatBox.innerHTML += `
                    <div class="flex gap-3 items-start">
                        <div class="w-8 h-8 rounded-full bg-indigo-600/20 text-indigo-400 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-robot text-sm"></i>
                        </div>
                        <div class="bg-slate-800 border border-slate-700/50 p-4 rounded-2xl max-w-[85%] text-slate-200 whitespace-pre-wrap">
                            ${aiReply}
                        </div>
                    </div>
                `;
            } catch (error) {
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();

                chatBox.innerHTML += `
                    <div class="flex gap-3 items-start">
                        <div class="w-8 h-8 rounded-full bg-red-600/20 text-red-400 flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-triangle-exclamation text-sm"></i>
                        </div>
                        <div class="bg-slate-800 border border-red-500/30 p-4 rounded-2xl max-w-[85%] text-red-300">
                            حدث خطأ أثناء الحصول على الرد، يرجى المحاولة مرة أخرى.
                        </div>
                    </div>
                `;
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
