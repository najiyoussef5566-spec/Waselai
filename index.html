<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WASEL_Ai</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --sidebar: #f7f7f8;
      --text: #171717;
      --muted: #6b6b6b;
      --border: #e5e5e5;
      --user: #f4f4f4;
      --black: #000000;
      --white: #ffffff;
    }

    body {
      font-family:
        Arial,
        "Noto Sans Arabic",
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);

      height: 100vh;
      overflow: hidden;
    }

    /* =========================
       APP
    ========================= */

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 260px;
      background: var(--sidebar);
      border-left: 1px solid var(--border);

      display: flex;
      flex-direction: column;

      padding: 14px;

      transition: width 0.2s ease;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar.hidden {
      width: 0;
      padding: 0;
      border: none;
    }

    .brand {
      display: flex;
      align-items: center;

      padding: 10px 8px 18px;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .new-chat {
      width: 100%;

      border: 1px solid var(--border);
      background: #ffffff;

      border-radius: 10px;

      padding: 11px 13px;

      cursor: pointer;

      font-size: 14px;
      font-weight: 600;

      display: flex;
      align-items: center;
      gap: 9px;

      transition: background 0.15s ease;
    }

    .new-chat:hover {
      background: #eeeeee;
    }

    .sidebar-bottom {
      margin-top: auto;

      border-top: 1px solid var(--border);

      padding-top: 12px;
    }

    .side-info {
      color: var(--muted);

      font-size: 12px;
      line-height: 1.7;

      text-align: center;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;

      display: flex;
      flex-direction: column;

      min-width: 0;

      background: #ffffff;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      height: 58px;

      display: flex;
      align-items: center;

      padding: 0 18px;

      border-bottom: 1px solid var(--border);

      background: #ffffff;

      position: relative;
      z-index: 5;
    }

    .menu-btn {
      width: 38px;
      height: 38px;

      border: none;
      background: transparent;

      border-radius: 8px;

      cursor: pointer;

      font-size: 21px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-btn:hover {
      background: #f0f0f0;
    }

    .header-title {
      margin-right: 8px;

      font-size: 17px;
      font-weight: 700;
    }

    .header-subtitle {
      margin-right: 8px;

      color: #777;

      font-size: 12px;
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      flex: 1;

      overflow-y: auto;

      padding: 30px 18px 155px;

      scroll-behavior: auto;

      -webkit-overflow-scrolling: touch;
    }

    .chat-inner {
      width: 100%;
      max-width: 850px;

      margin: auto;
    }

    /* =========================
       WELCOME
    ========================= */

    .welcome {
      min-height: calc(100vh - 220px);

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 20px;
    }

    /* =========================
       W LOGO
    ========================= */

    .logo {
      width: 62px;
      height: 62px;

      border-radius: 16px;

      background: #ffffff;

      border: 1px solid #e5e5e5;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 18px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.05);
    }

    .logo svg {
      width: 45px;
      height: 45px;

      display: block;
    }

    .welcome h1 {
      font-size: 30px;

      margin-bottom: 10px;

      letter-spacing: -0.8px;
    }

    .welcome p {
      color: var(--muted);

      font-size: 14px;

      max-width: 500px;

      line-height: 1.8;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: flex;

      gap: 13px;

      margin: 0 auto 28px;

      width: 100%;
    }

    .avatar {
      flex: 0 0 32px;

      width: 32px;
      height: 32px;

      border-radius: 9px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 10px;
      font-weight: 800;

      margin-top: 2px;
    }

    .assistant .avatar {
      background: #000000;
      color: #ffffff;
    }

    .user .avatar {
      background: #eeeeee;
      color: #171717;
    }

    .message-content {
      flex: 1;

      min-width: 0;

      line-height: 1.85;

      font-size: 15px;

      white-space: pre-wrap;

      overflow-wrap: anywhere;
    }

    .user .message-content {
      background: var(--user);

      border-radius: 16px;

      padding: 10px 14px;

      max-width: 75%;
    }

    .assistant .message-content {
      padding-top: 2px;
    }

    /* =========================
       FILE PREVIEW
    ========================= */

    .file-preview {
      margin-bottom: 10px;

      border: 1px solid var(--border);

      border-radius: 12px;

      overflow: hidden;

      max-width: 400px;

      background: #fafafa;
    }

    .file-preview img {
      display: block;

      width: 100%;

      max-height: 300px;

      object-fit: contain;

      background: #f2f2f2;
    }

    .file-name {
      padding: 9px 12px;

      font-size: 12px;

      color: #555;
    }

    /* =========================
       GENERATED IMAGE
    ========================= */

    .generated-image {
      margin-top: 10px;

      max-width: 520px;

      width: 100%;

      border-radius: 15px;

      border: 1px solid var(--border);

      display: block;
    }

    /* =========================
       INPUT AREA
    ========================= */

    .input-area {
      position: fixed;

      bottom: 0;

      right: 0;
      left: 0;

      background:
        linear-gradient(
          to top,
          #ffffff 72%,
          rgba(255, 255, 255, 0)
        );

      padding: 20px 18px 18px;

      z-index: 10;
    }

    .input-wrapper {
      max-width: 850px;

      margin: auto;

      border: 1px solid #d9d9d9;

      border-radius: 18px;

      background: #ffffff;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.06);

      padding: 9px;

      display: flex;

      align-items: flex-end;

      gap: 8px;
    }

    textarea {
      flex: 1;

      border: none;

      outline: none;

      resize: none;

      background: transparent;

      font-family: inherit;

      font-size: 15px;

      line-height: 1.6;

      max-height: 160px;

      min-height: 42px;

      padding: 9px 7px;

      color: var(--text);
    }

    textarea::placeholder {
      color: #8a8a8a;
    }

    .icon-btn {
      width: 40px;
      height: 40px;

      border: none;

      background: transparent;

      border-radius: 10px;

      cursor: pointer;

      font-size: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: #eeeeee;
    }

    .send-btn {
      width: 40px;
      height: 40px;

      border: none;

      border-radius: 50%;

      background: #171717;

      color: #ffffff;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;

      flex-shrink: 0;

      transition: background 0.15s ease;
    }

    .send-btn:hover {
      background: #333333;
    }

    .send-btn:disabled {
      background: #d5d5d5;

      cursor: not-allowed;
    }

    /* =========================
       FILE INFO
    ========================= */

    .file-info {
      max-width: 850px;

      margin: 0 auto 7px;

      display: none;

      align-items: center;

      justify-content: space-between;

      background: #f4f4f4;

      border: 1px solid var(--border);

      border-radius: 10px;

      padding: 8px 11px;

      font-size: 12px;
    }

    .file-info.show {
      display: flex;
    }

    .remove-file {
      border: none;

      background: transparent;

      cursor: pointer;

      font-size: 16px;
    }

    .footer-note {
      max-width: 850px;

      margin: 7px auto 0;

      text-align: center;

      color: #999;

      font-size: 10px;
    }

    #fileInput {
      display: none;
    }

    /* =========================
       TYPING
    ========================= */

    .typing {
      display: flex;

      align-items: center;

      gap: 4px;

      padding: 8px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #777777;

      animation: typing 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .sidebar {
        position: fixed;

        top: 0;
        bottom: 0;

        right: 0;

        z-index: 50;

        box-shadow:
          -5px 0 25px rgba(0, 0, 0, 0.08);
      }

      .sidebar.hidden {
        width: 0;
      }

      .header {
        height: 55px;
      }

      .chat {
        padding: 22px 12px 145px;
      }

      .welcome {
        min-height: calc(100vh - 200px);
      }

      .welcome h1 {
        font-size: 25px;
      }

      .message {
        gap: 9px;

        margin-bottom: 23px;
      }

      .avatar {
        width: 29px;
        height: 29px;

        flex-basis: 29px;

        border-radius: 8px;
      }

      .message-content {
        font-size: 14px;
      }

      .user .message-content {
        max-width: 88%;
      }

      .input-area {
        padding: 13px 9px 10px;
      }

      .input-wrapper {
        border-radius: 16px;
      }

      .footer-note {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="brand">

        <div class="brand-name">
          WASEL_Ai
        </div>

      </div>

      <button
        class="new-chat"
        onclick="newChat()"
      >

        <span>＋</span>

        <span>
          محادثة جديدة
        </span>

      </button>

      <div class="sidebar-bottom">

        <div class="side-info">

          WASEL_Ai
          <br>

          مساعدك الذكي

        </div>

      </div>

    </aside>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

      <!-- HEADER -->

      <header class="header">

        <button
          class="menu-btn"
          onclick="toggleSidebar()"
          title="القائمة"
        >
          ☰
        </button>

        <div class="header-title">
          WASEL_Ai
        </div>

        <div class="header-subtitle">
          AI
        </div>

      </header>


      <!-- CHAT -->

      <section
        class="chat"
        id="chat"
      >

        <div
          class="chat-inner"
          id="chatInner"
        >

          <!-- WELCOME -->

          <div
            class="welcome"
            id="welcome"
          >

            <!-- W LOGO -->

            <div class="logo">

              <svg
                viewBox="0 0 100 100"
                xmlns="http://www.w3.org/2000/svg"
                aria-label="WASEL_Ai"
              >

                <!-- الشكل الأسود -->

                <path
                  d="
                    M20 28
                    C20 18, 34 18, 40 28
                    L50 48
                    L60 28
                    C66 18, 80 18, 80 28
                    C80 40, 68 48, 60 57
                    L50 68
                    L40 57
                    C32 48, 20 40, 20 28
                    Z
                  "

                  fill="#000000"
                />

                <!-- الالتفاف الداخلي -->

                <path
                  d="
                    M30 31
                    C35 27, 39 34, 42 40
                    L50 56
                    L58 40
                    C61 34, 65 27, 70 31
                  "

                  fill="none"

                  stroke="#ffffff"

                  stroke-width="7"

                  stroke-linecap="round"
                />

              </svg>

            </div>


            <h1>
              كيف يمكنني مساعدتك؟
            </h1>


            <p>
              أنا WASEL_Ai، مساعدك الذكي للمحادثة وتحليل الصور والملفات.
            </p>

          </div>

        </div>

      </section>


      <!-- INPUT -->

      <div class="input-area">

        <div
          class="file-info"
          id="fileInfo"
        >

          <span id="fileName"></span>

          <button
            class="remove-file"
            onclick="removeFile()"
            title="إزالة الملف"
          >
            ×
          </button>

        </div>


        <div class="input-wrapper">

          <!-- ATTACH -->

          <button
            class="icon-btn"
            onclick="document.getElementById('fileInput').click()"
            title="إرفاق ملف"
          >
            📎
          </button>


          <input
            id="fileInput"
            type="file"
            accept="image/*,video/*,audio/*,application/pdf"
            onchange="handleFile(event)"
          />


          <!-- TEXT -->

          <textarea
            id="messageInput"
            placeholder="اكتب رسالتك..."
            rows="1"
            onkeydown="handleKeyDown(event)"
            oninput="autoResize(this)"
          ></textarea>


          <!-- SEND -->

          <button
            class="send-btn"
            id="sendButton"
            onclick="sendMessage()"
            title="إرسال"
          >
            ↑
          </button>

        </div>


        <div class="footer-note">
          قد يخطئ WASEL_Ai أحيانًا، تحقق من المعلومات المهمة.
        </div>

      </div>

    </main>

  </div>


  <script>

    /* =========================
       VARIABLES
    ========================= */

    let selectedFile = null;


    /* =========================
       SIDEBAR
    ========================= */

    function toggleSidebar() {

      const sidebar =
        document.getElementById("sidebar");

      sidebar.classList.toggle("hidden");
    }


    /* =========================
       NEW CHAT
    ========================= */

    function newChat() {

      const chatInner =
        document.getElementById("chatInner");

      chatInner.innerHTML = `

        <div
          class="welcome"
          id="welcome"
        >

          <div class="logo">

            <svg
              viewBox="0 0 100 100"
              xmlns="http://www.w3.org/2000/svg"
              aria-label="WASEL_Ai"
            >

              <path
                d="
                  M20 28
                  C20 18, 34 18, 40 28
                  L50 48
                  L60 28
                  C66 18, 80 18, 80 28
                  C80 40, 68 48, 60 57
                  L50 68
                  L40 57
                  C32 48, 20 40, 20 28
                  Z
                "

                fill="#000000"
              />

              <path
                d="
                  M30 31
                  C35 27, 39 34, 42 40
                  L50 56
                  L58 40
                  C61 34, 65 27, 70 31
                "

                fill="none"

                stroke="#ffffff"

                stroke-width="7"

                stroke-linecap="round"
              />

            </svg>

          </div>

          <h1>
            كيف يمكنني مساعدتك؟
          </h1>

          <p>
            أنا WASEL_Ai، مساعدك الذكي للمحادثة وتحليل الصور والملفات.
          </p>

        </div>
      `;

      removeFile();

      document.getElementById(
        "messageInput"
      ).value = "";

      autoResize(
        document.getElementById(
          "messageInput"
        )
      );
    }


    /* =========================
       FILE
    ========================= */

    function handleFile(event) {

      const file =
        event.target.files[0];

      if (!file) return;


      const maxSize =
        3.5 * 1024 * 1024;


      if (file.size > maxSize) {

        alert(
          "حجم الملف كبير جدًا. الحد الأقصى 3.5 MB."
        );

        event.target.value = "";

        return;
      }


      selectedFile = file;


      document.getElementById(
        "fileName"
      ).textContent = file.name;


      document.getElementById(
        "fileInfo"
      ).classList.add("show");
    }


    function removeFile() {

      selectedFile = null;


      document.getElementById(
        "fileInput"
      ).value = "";


      document.getElementById(
        "fileInfo"
      ).classList.remove("show");


      document.getElementById(
        "fileName"
      ).textContent = "";
    }


    /* =========================
       TEXTAREA
    ========================= */

    function autoResize(textarea) {

      textarea.style.height = "auto";

      textarea.style.height =
        Math.min(
          textarea.scrollHeight,
          160
        ) + "px";
    }


    function handleKeyDown(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();
      }
    }


    /* =========================
       FILE BASE64
    ========================= */

    function fileToBase64(file) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();

          reader.onload = () =>
            resolve(reader.result);

          reader.onerror =
            reject;

          reader.readAsDataURL(file);
        }
      );
    }


    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessage(
      type,
      text,
      fileData = null,
      fileName = "",
      mimeType = ""
    ) {

      const chatInner =
        document.getElementById(
          "chatInner"
        );


      const welcome =
        document.getElementById(
          "welcome"
        );


      if (welcome) {
        welcome.remove();
      }


      const message =
        document.createElement(
          "div"
        );


      message.className =
        `message ${type}`;


      const avatar =
        document.createElement(
          "div"
        );


      avatar.className =
        "avatar";


      avatar.textContent =
        type === "user"
          ? "أنت"
          : "WA";


      const content =
        document.createElement(
          "div"
        );


      content.className =
        "message-content";


      /* IMAGE FILE */

      if (
        fileData &&
        mimeType.startsWith(
          "image/"
        )
      ) {

        const preview =
          document.createElement(
            "div"
          );
